# =============================================================================
# Release → PRODUCTION
#   • git tag v0.1.0 && git push origin v0.1.0
#     → vérifie que le commit est sur main et que sa CI a publié les images (site et API),
#       re-étiquette CES images (aucune reconstruction), crée la Release GitHub,
#       déploie en production, teste, revient en arrière si besoin.
#   • Actions → Release → « Run workflow » avec une version existante = retour à cette version.
# Seul le propriétaire du dépôt peut déclencher la production.
# =============================================================================
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version déjà publiée à (re)déployer en production, ex. v0.1.0"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promouvoir l'image testée
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner
    timeout-minutes: 30
    permissions:
      contents: write # création de la Release GitHub
      packages: write # ajout de l'étiquette de version sur l'image
      actions: read # S7.5-T01 : lire le résultat de la CI du commit
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.ref.outputs.digest }}
      api-image: ${{ steps.ref.outputs.api_image }}
      api-digest: ${{ steps.ref.outputs.api_digest }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Identifier l'image
        id: ref
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          api="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="$GITHUB_REF_NAME"
            [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag invalide : $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::Le tag $version ne pointe pas sur un commit de main."; exit 1; }
            # S7.5-T01 : les images sont publiées pendant que les tests tournent encore ; on exige donc la CI/CD de
            # ce commit sur main TERMINÉE ET VERTE (bout en bout et pile serveur compris) avant toute promotion
            echo "Attente de la CI/CD de main pour $GITHUB_SHA…"
            for i in $(seq 1 60); do
              ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' || true)
              case "$ci" in
                "completed success") echo "✅ CI/CD verte"; break ;;
                completed*) echo "::error::La CI/CD de ce commit n'est pas verte ($ci) : rien n'est promu."; exit 1 ;;
              esac
              [ "$i" = 60 ] && { echo "::error::CI/CD de ce commit introuvable ou pas terminée après 30 min."; exit 1; }
              sleep 30
            done
            src="$image:sha-$GITHUB_SHA"
            echo "Attente de l'image $src (publiée par la CI de main)…"
            for i in $(seq 1 40); do
              docker buildx imagetools inspect "$src" >/dev/null 2>&1 && break
              [ "$i" = 40 ] && { echo "::error::Image introuvable : la CI de ce commit a-t-elle réussi ?"; exit 1; }
              sleep 30
            done
            docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$src"
            # Image de l'API (S3-T06), construite et vérifiée par la même CI : même version pour les deux
            docker buildx imagetools inspect "$api:sha-$GITHUB_SHA" >/dev/null 2>&1 \
              || { echo "::error::Image de l'API introuvable pour ce commit : la CI de main a-t-elle réussi ?"; exit 1; }
            docker buildx imagetools create -t "$api:$version" -t "$api:latest" "$api:sha-$GITHUB_SHA"
          else
            version="$INPUT_VERSION"
            [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version invalide : $version"; exit 1; }
          fi
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Digest introuvable pour $version"; exit 1; }
          # S7-T04 : l'API est déployée avec le site (même version)
          api_digest=$(docker buildx imagetools inspect "$api:$version" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $api_digest =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Digest de l'API introuvable pour $version"; exit 1; }
          { echo "image=$image"; echo "digest=$digest"; echo "api_image=$api"; echo "api_digest=$api_digest"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          echo "Images promues : $image:$version ($digest), $api:$version ($api_digest)"

      - name: Créer la Release GitHub
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Kemdia $GITHUB_REF_NAME"

  deploy-production:
    name: Déploiement PRODUCTION
    needs: promote
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image: ${{ needs.promote.outputs.image }}@${{ needs.promote.outputs.digest }}
      api-image: ${{ needs.promote.outputs.api-image }}@${{ needs.promote.outputs.api-digest }}
      version: ${{ needs.promote.outputs.version }}
      url: ${{ vars.PRODUCTION_URL }}
    secrets: inherit
