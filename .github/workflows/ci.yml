# =============================================================================
# CI/CD — à chaque Pull Request : qualité + image scannée.
#          à chaque push sur main : idem + publication de l'image + déploiement STAGING automatique.
# La production est déployée par release.yml (tag de version vX.Y.Z).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Allègement (S5-T08, ADR-0030) : une PR qui ne change QUE de la documentation (docs/**, *.md) saute les jobs
  # lourds (base de données, bout en bout, images). Ils sont « sautés », pas « en attente » : une vérification
  # obligatoire sautée compte comme réussie. Les pushes sur main et les lancements manuels font toujours tout.
  changes:
    name: Ce qui a changé
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          all() { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          # Prudence (relecture S5-T08) : au moindre doute, tout tourne
          # - API injoignable, liste vide ;
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') || all
          [ -n "$files" ] || all
          # - nom avec un caractère de contrôle (un retour à la ligne couperait un nom en deux) ;
          odd=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty) | select(test("[[:cntrl:]]"))') || all
          [ -z "$odd" ] || all
          # - liste tronquée (l'API s'arrête à 3000 fichiers).
          total=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files') || all
          listed=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | wc -l) || all
          [ "$total" -le 2999 ] && [ "$listed" -ge "$total" ] || all
          if printf '%s\n' "$files" | grep -Ev '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation seulement : base de données, bout en bout et images sautés." >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile
      - name: Format (Prettier)
        run: pnpm format:check
      - name: Lint (ESLint)
        run: pnpm lint
      - name: Vérification des types (TypeScript)
        run: pnpm typecheck
      - name: Tests unitaires et composants du site (Vitest)
        run: pnpm --filter @kemdia/web exec vitest run --coverage
      - name: Tests de l'API (Vitest)
        run: pnpm --filter @kemdia/api exec vitest run --coverage
      - name: Tests du contrat partagé (Vitest)
        run: pnpm --filter @kemdia/contracts test
      - name: Build de production
        run: pnpm build

      - name: Publier la couverture de tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            apps/web/coverage
            apps/api/coverage
          retention-days: 7

  database:
    name: API — migrations et intégration (PostgreSQL)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    # Base éphémère : créée pour ce job, détruite à la fin. Mot de passe de test, sans valeur hors du job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kemdia
          POSTGRES_PASSWORD: kemdia_ci
          # Nom en « _test » : seule sorte de base que les tests d'intégration acceptent de vider
          POSTGRES_DB: kemdia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kemdia -d kemdia_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://kemdia:kemdia_ci@localhost:5432/kemdia_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile
      - name: Générer le client Prisma
        run: pnpm --filter @kemdia/api generate
      - name: Appliquer les migrations sur une base vide
        run: pnpm --filter @kemdia/api db:deploy
      - name: Vérifier que les migrations correspondent au schéma Prisma
        # Code 2 = écart : une modification de prisma/schema n'a pas sa migration (pnpm db:migrate).
        # En cas d'écart, le SQL manquant est affiché en annotation sur la PR.
        working-directory: apps/api
        run: |
          if pnpm db:check; then exit 0; fi
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --script > /tmp/ecart.sql || true
          echo "::error title=Migration manquante::Le schéma Prisma et les migrations diffèrent. SQL manquant :%0A$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/ecart.sql | head -c 3500)"
          exit 1
      - name: Importer le catalogue de démonstration (vérifie la commande db:seed)
        run: pnpm --filter @kemdia/api db:seed
      - name: Tests d'intégration de l'API (vraie base)
        run: pnpm --filter @kemdia/api test:int

  e2e:
    name: Bout en bout et performance (site + API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    # Le site lit la VRAIE API (S3-T05) : base éphémère, détruite à la fin du job
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kemdia
          POSTGRES_PASSWORD: kemdia_ci
          POSTGRES_DB: kemdia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kemdia -d kemdia"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Boîte de test : l'API y envoie ses e-mails, les tests y lisent les codes (S4-T05)
      mailpit:
        image: axllent/mailpit:v1.31.4
        env:
          MP_MAX_MESSAGE_SIZE: "1"
        ports:
          - 8025:8025
    env:
      DATABASE_URL: postgresql://kemdia:kemdia_ci@localhost:5432/kemdia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile
      - name: Installer le navigateur Chromium (version liée à Playwright)
        run: pnpm --filter @kemdia/web exec playwright install --with-deps chromium

      - name: Clé interne éphémère (masquée dans les journaux)
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "E2E_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Construire l'API
        run: pnpm --filter @kemdia/api build
      - name: Construire le site — avec une API injoignable (preuve S3-T05)
        # Une adresse d'API qui ne répond pas est configurée pendant `next build` : si une page lisait
        # le catalogue à la construction, la garde (lib/catalog) ferait échouer cette étape.
        env:
          API_URL: http://api-injoignable.invalid:4000
          API_INTERNAL_KEY: ${{ env.E2E_API_KEY }}
        run: pnpm --filter @kemdia/web build

      - name: Base de démonstration (migrations par le script de l'image + import)
        run: |
          pnpm --filter @kemdia/api migrate
          pnpm --filter @kemdia/api db:seed
      - name: Comptes, boutiques et produits de test des parcours (base éphémère du job uniquement)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/web/e2e/fixtures/compte-e2e.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/web/e2e/fixtures/photos-vendeur-e2e.sql
          # Comptes de test (administrateur, vendeurs) : ces fichiers refusent de tourner sans ce réglage (S6-T05, S6-T06)
          PGOPTIONS='-c kemdia.e2e=on' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/web/e2e/fixtures/equipe-e2e.sql
          PGOPTIONS='-c kemdia.e2e=on' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/web/e2e/fixtures/vendeur-e2e.sql
      - name: Démarrer l'API
        env:
          NODE_ENV: production
          # Comme la démo publique (S5-T07) : opérateur Mobile Money simulé et factures émises, pour parcourir le
          # premier achat de bout en bout. Base éphémère du job : rien n'est réel.
          APP_ENV: demo
          APP_VERSION: sha-${{ github.sha }}
          PORT: "4000"
          LOG_LEVEL: info
          API_INTERNAL_KEY: ${{ env.E2E_API_KEY }}
          API_DOCS: "false"
          EMAIL_TRANSPORT: mailpit
          MAILPIT_URL: http://127.0.0.1:8025
        run: |
          # Vérification des vendeurs (S6-T08) : clé jetable, tirée à chaque passage (base éphémère, rien de réel)
          KYC_ENCRYPTION_KEY="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
          export KYC_ENCRYPTION_KEY
          nohup node apps/api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health; then echo; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Parcours dans un vrai navigateur (téléphone + ordinateur), site branché sur l'API
        env:
          E2E_API_URL: http://127.0.0.1:4000
          E2E_ACCOUNT: "1"
          E2E_MAILPIT_URL: http://127.0.0.1:8025
          E2E_SANDBOX: "1"
        run: pnpm --filter @kemdia/web e2e
      - name: Budget de performance (téléphone, 3G, cache vide), site branché sur l'API
        env:
          E2E_API_URL: http://127.0.0.1:4000
        run: pnpm --filter @kemdia/web perf
      - name: Vérifier que le site a bien lu l'API (et seulement elle)
        run: |
          served=$(grep -c '"statusCode":200' "$RUNNER_TEMP/api.log" || true)
          limited=$(grep -c '"statusCode":429' "$RUNNER_TEMP/api.log" || true)
          echo "Requêtes servies par l'API : $served · refusées (limite de débit) : $limited"
          echo "### Site branché sur l'API : $served requêtes servies, $limited limitées" >> "$GITHUB_STEP_SUMMARY"
          [ "$served" -gt 100 ] && [ "$limited" -eq 0 ]
      - name: Tableau des mesures dans le résumé
        if: always()
        working-directory: apps/web
        run: |
          node scripts/perf-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          node scripts/perf-summary.mjs --annotations

      - name: Journal de l'API en cas d'échec
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true
      - name: Publier le rapport en cas d'échec (captures, traces)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapport-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  image:
    name: Image Docker (build · scan · publication)
    runs-on: ubuntu-latest
    # Aucune image n'est construite ni publiée si un parcours client est cassé
    needs: [quality, e2e, database]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # publication sur GitHub Container Registry
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    env:
      # Publication sur main : après une fusion (push) OU un lancement manuel (Run workflow)
      PUBLISH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      # Docker Hub : activé dès que DOCKERHUB_USERNAME (variable conseillée, ou secret) et le secret DOCKERHUB_TOKEN existent.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'kemdia' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        name: Noms et étiquettes de l'image
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}/web"
          tags="$ghcr:sha-$GITHUB_SHA"$'\n'"$ghcr:main"
          dockerhub=""
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            dockerhub="docker.io/${DOCKERHUB_USERNAME,,}/${DOCKERHUB_REPO,,}"
            tags="$tags"$'\n'"$dockerhub:sha-$GITHUB_SHA"$'\n'"$dockerhub:main"$'\n'"$dockerhub:latest"
          fi
          {
            echo "image=$ghcr"
            echo "dockerhub=$dockerhub"
            echo "tags<<EOF"; echo "$tags"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion au registre GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connexion à Docker Hub
        if: env.PUBLISH == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # jeton d'accès Docker Hub, jamais le mot de passe du compte

      # 1. Construire l'image localement et la scanner AVANT toute publication
      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: kemdia-web:scan
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://kemdia.ga' }}
            APP_VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scanner l'image (Trivy — CVE critiques et hautes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kemdia-web:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Démarrer l'image dans les configurations du catalogue (S3-T05, S3-T08)
        run: |
          wait_up() { for i in $(seq 1 40); do curl -fsS "$1/api/health" >/dev/null 2>&1 && return 0; sleep 1; done; return 1; }

          echo "Cas 2 et 3 — sans API_URL (production comme démo) : le site doit refuser de démarrer"
          for env in production demo; do
            set +e
            timeout 60 docker run --rm -e APP_ENV=$env kemdia-web:scan > "sans-api-$env.log" 2>&1
            code=$?
            set -e
            cat "sans-api-$env.log"
            [ "$code" -eq 1 ]
            grep -q "API_URL : obligatoire" "sans-api-$env.log"
          done

          echo "Cas 1 — API_URL définie mais injoignable : page d'erreur, jamais de catalogue de secours"
          docker run -d --name cas1 -p 3101:3000 -e APP_ENV=staging \
            -e API_URL=http://127.0.0.1:9 -e API_INTERNAL_KEY="$(openssl rand -hex 32)" kemdia-web:scan
          wait_up http://127.0.0.1:3101
          status=$(curl -s -o cas1.html -w '%{http_code}' http://127.0.0.1:3101/produit/apple-google-pixel-modern-blanc)
          echo "statut : $status"
          [ "$status" = "500" ]
          if grep -q "Apple Google Pixel Modern Blanc" cas1.html; then echo "::error::produit affiché sans API"; exit 1; fi
          echo "### Image : sans API le site refuse de démarrer ; API muette → page d'erreur" >> "$GITHUB_STEP_SUMMARY"

      # 2. Publier (main uniquement) — le cache rend cette étape quasi instantanée
      # Une seule construction poussée vers GHCR ET Docker Hub : même digest partout
      - name: Publier l'image (GHCR + Docker Hub)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://kemdia.ga' }}
            APP_VERSION=sha-${{ github.sha }}
          cache-from: type=gha

      - name: Résumé de la publication
        if: env.PUBLISH == 'true'
        env:
          GHCR: ${{ steps.meta.outputs.image }}
          DOCKERHUB: ${{ steps.meta.outputs.dockerhub }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image publiée"
            echo "- GHCR : \`$GHCR:main\`"
            if [ -n "$DOCKERHUB" ]; then
              echo "- Docker Hub : \`${DOCKERHUB#docker.io/}:latest\` — https://hub.docker.com/r/${DOCKERHUB#docker.io/}"
            else
              echo "- Docker Hub : non configuré : DOCKERHUB_USERNAME introuvable (ni variable ni secret)"
            fi
            echo "- Digest : \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  image-api:
    name: Image Docker de l'API (build · scan · migrations · publication)
    runs-on: ubuntu-latest
    needs: [quality, database]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # publication sur GitHub Container Registry
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    # Base éphémère VIDE : l'image doit savoir la créer elle-même (migrations), puis la servir
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kemdia
          POSTGRES_PASSWORD: kemdia_ci
          POSTGRES_DB: kemdia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kemdia -d kemdia"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PUBLISH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
      # Docker Hub (S3-T07) : image PUBLIQUE de l'API, tirée par la démo Render sans identifiants.
      # Mêmes réglages que l'image du site ; dépôt « <utilisateur>/kemdia-api » par défaut.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_API_REPO: ${{ vars.DOCKERHUB_API_REPO || 'kemdia-api' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        name: Noms et étiquettes de l'image
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          tags="$ghcr:sha-$GITHUB_SHA"$'\n'"$ghcr:main"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            dockerhub="docker.io/${DOCKERHUB_USERNAME,,}/${DOCKERHUB_API_REPO,,}"
            tags="$tags"$'\n'"$dockerhub:sha-$GITHUB_SHA"$'\n'"$dockerhub:main"$'\n'"$dockerhub:latest"
          fi
          {
            echo "image=$ghcr"
            echo "tags<<EOF"; echo "$tags"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion au registre GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connexion à Docker Hub
        if: env.PUBLISH == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # jeton d'accès Docker Hub, jamais le mot de passe du compte

      # 1. Construire l'image localement et la vérifier AVANT toute publication
      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: kemdia-api:scan
          build-args: APP_VERSION=sha-${{ github.sha }}
          # Cache séparé de celui du site (sinon les deux images s'évincent l'une l'autre)
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Scanner l'image (Trivy — CVE critiques et hautes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kemdia-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Migrations puis démarrage, avec l'image seule (S3-T06)
        env:
          DB: postgresql://kemdia:kemdia_ci@127.0.0.1:5432/kemdia
        run: |
          # Mêmes contraintes qu'en production : lecture seule, aucun privilège, utilisateur non-root
          run() {
            docker run --rm --network host --read-only --tmpfs /tmp --cap-drop ALL \
              --security-opt no-new-privileges -e APP_ENV=staging "$@"
          }
          migrations=$(find apps/api/prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          applied() { psql "$DB" -tAc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL'; }

          echo "1. Migrations sur une base VIDE ($migrations dans le dépôt)"
          run -e DATABASE_URL="$DB" kemdia-api:scan node dist/database/migrate.js
          [ "$(applied)" -eq "$migrations" ]
          psql "$DB" -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'catalog' AND table_name = 'products'" | grep -q 1

          echo "2. Relancées : rien à faire, aucune erreur"
          run -e DATABASE_URL="$DB" kemdia-api:scan node dist/database/migrate.js
          [ "$(applied)" -eq "$migrations" ]

          echo "3. Configuration fausse : refus (code 1) AVANT de toucher la base"
          set +e
          run kemdia-api:scan node dist/database/migrate.js > refus.log 2>&1; code=$?
          set -e
          cat refus.log
          # (une ligne par vérification : `set -e` ne réagit pas à l'échec du début d'une liste « a && b »)
          [ "$code" -eq 1 ]
          grep -q "DATABASE_URL : obligatoire en production" refus.log

          echo "4. Base injoignable : échec (code ≠ 0), la nouvelle version ne démarrerait pas"
          if run -e DATABASE_URL=postgresql://kemdia:x@127.0.0.1:9/kemdia kemdia-api:scan node dist/database/migrate.js; then
            echo "::error::les migrations auraient dû échouer"; exit 1
          fi

          echo "5. L'API démarre sur la base migrée"
          docker run -d --name api --network host --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e APP_ENV=staging -e DATABASE_URL="$DB" kemdia-api:scan
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4000/api/health > health.json 2>/dev/null && break; sleep 1; done
          cat health.json; echo
          grep -q '"database":"ok"' health.json
          grep -q "\"version\":\"sha-$GITHUB_SHA\"" health.json
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/v1/categories)" = "200" ]
          [ "$(docker exec api id -u)" != "0" ]
          if docker exec api sh -c 'echo x > /app/dist/main.js' 2>/dev/null; then
            echo "::error::l'API peut modifier son propre code"; exit 1
          fi
          docker logs api 2>&1 | tail -n 5

          size=$(docker image inspect kemdia-api:scan --format '{{.Size}}')
          {
            echo "### Image de l'API vérifiée"
            echo "- $migrations migration(s) appliquée(s) sur une base vide, puis relance sans effet"
            echo "- Configuration fausse ou base injoignable : refus"
            echo "- API démarrée en lecture seule, utilisateur non-root, base \`ok\`"
            echo "- Taille : $((size / 1024 / 1024)) Mo"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Démarrage de la démo Render, avec l'image seule (S3-T07)
        env:
          ADMIN: postgresql://kemdia:kemdia_ci@127.0.0.1:5432/kemdia
          DB: postgresql://kemdia:kemdia_ci@127.0.0.1:5432/kemdia_demo
        run: |
          # Base VIDE, comme une base Neon toute neuve : la démo doit tout créer seule
          psql "$ADMIN" -c 'CREATE DATABASE kemdia_demo'
          demo() {
            docker run -d --name "$1" --network host --read-only --tmpfs /tmp --cap-drop ALL \
              --security-opt no-new-privileges -e APP_ENV=demo -e PORT=4001 -e DATABASE_URL="$DB" \
              kemdia-api:scan node dist/database/start-demo.js
          }
          ready() { for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4001/api/health > demo.json 2>/dev/null && return 0; sleep 1; done; return 1; }

          echo "1. Refusée hors démo : rien n'est lancé"
          if docker run --rm --network host -e APP_ENV=staging -e DATABASE_URL="$DB" kemdia-api:scan \
               node dist/database/start-demo.js > refus-demo.log 2>&1; then
            echo "::error::le démarrage de démo aurait dû être refusé"; exit 1
          fi
          grep -q "APP_ENV doit valoir « demo »" refus-demo.log
          [ "$(psql "$DB" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'catalog'")" -eq 0 ]

          echo "2. Premier démarrage : migrations, import de démonstration, puis l'API"
          demo demo1
          ready
          cat demo.json; echo
          grep -q '"environment":"demo"' demo.json
          grep -q '"database":"ok"' demo.json
          docker logs demo1 2>&1 | grep -q "la base est à jour"
          docker logs demo1 2>&1 | grep -q "Catalogue de démonstration importé : 112 catégories, 50 produits"
          [ "$(psql "$DB" -tAc 'SELECT count(*) FROM catalog.products')" -eq 50 ]
          curl -fsS http://127.0.0.1:4001/api/v1/products/apple-google-pixel-modern-blanc | grep -q "Apple Google Pixel Modern Blanc"

          echo "3. Réveil (redémarrage) : rien à migrer, import relancé sans doublon"
          docker rm -f demo1 >/dev/null
          demo demo2
          ready
          [ "$(psql "$DB" -tAc 'SELECT count(*) FROM catalog.products')" -eq 50 ]
          [ "$(psql "$DB" -tAc 'SELECT count(*) FROM catalog.categories')" -eq 112 ]
          docker logs demo2 2>&1 | grep "Catalogue de démonstration importé"
          docker rm -f demo2 >/dev/null
          echo "- Démo Render : migrations + import + API sur une base vide, puis redémarrage sans doublon" >> "$GITHUB_STEP_SUMMARY"

      - name: Journal de l'API en cas d'échec
        if: failure()
        run: |
          for c in api demo1 demo2; do docker logs "$c" 2>&1 | tail -n 100 || true; done

      # 2. Publier (main uniquement) — le cache rend cette étape quasi instantanée
      # Une seule construction poussée vers GHCR ET Docker Hub (S3-T07) : même digest partout
      - name: Publier l'image (GHCR + Docker Hub)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: APP_VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=api

      - name: Résumé de la publication
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image de l'API publiée"
            echo "- GHCR : \`$IMAGE:sha-$GITHUB_SHA\` (digest \`$DIGEST\`)"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              repo="${DOCKERHUB_USERNAME,,}/${DOCKERHUB_API_REPO,,}"
              echo "- Docker Hub : \`$repo:latest\` — https://hub.docker.com/r/$repo (doit être **publique** pour la démo Render)"
            else
              echo "- Docker Hub : non configuré : DOCKERHUB_USERNAME introuvable (ni variable ni secret)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Pile serveur (S7-T04, ADR-0043) : sans serveur loué, on monte ICI ce que le VPS fera tourner — Caddy, site, API,
  # PostgreSQL — avec les VRAIS fichiers de deploy/ (setup-server.sh --fichiers-seulement, init-secrets.sh, deploy.sh,
  # compose.yml, Caddyfile) et des images construites à partir du cache de la CI, servies par un registre local.
  server-stack:
    name: Pile serveur (Caddy · site · API · PostgreSQL)
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    env:
      REPO: localhost:5000/kemdia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host # le constructeur doit joindre le registre local

      - name: Image du site (cache de la CI) → registre local
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REPO }}/web:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://localhost
            APP_VERSION=ci
          cache-from: type=gha

      - name: Image de l'API (cache de la CI) → registre local
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REPO }}/api:ci
          cache-from: type=gha,scope=api

      - name: Fichiers du serveur, secrets et Caddy (comme sur le VPS)
        run: |
          sudo IMAGE_REPO="$REPO" KEMDIA_GROUP=docker bash deploy/bin/setup-server.sh --fichiers-seulement
          sudo KEMDIA_SECRETS_GROUP=docker /opt/kemdia/bin/init-secrets.sh production localhost
          # Un second passage ne remplace RIEN (une clé perdue rend des données illisibles)
          before=$(sudo sha256sum /opt/kemdia/secrets/production.api.env)
          if sudo KEMDIA_SECRETS_GROUP=docker /opt/kemdia/bin/init-secrets.sh production localhost 2>/dev/null; then
            echo "::error::init-secrets.sh a accepté de réécrire des secrets existants"; exit 1
          fi
          [ "$before" = "$(sudo sha256sum /opt/kemdia/secrets/production.api.env)" ]
          for f in db api web; do
            [ "$(sudo stat -c '%a %U' /opt/kemdia/secrets/production.$f.env)" = "640 root" ] \
              || { echo "::error::droits inattendus sur production.$f.env"; exit 1; }
          done
          # Moindre privilège : le site ne reçoit ni clé de chiffrement ni adresse de la base
          if sudo grep -qE '^(TOTP_ENCRYPTION_KEY|KYC_ENCRYPTION_KEY|DATABASE_URL)=' /opt/kemdia/secrets/production.web.env; then
            echo "::error::le fichier du site contient un secret de l'API"; exit 1
          fi
          hash=$(docker run --rm caddy:2-alpine caddy hash-password --plaintext "ci-$RANDOM-$RANDOM")
          printf 'ACME_EMAIL=ci@example.com\nPROD_DOMAIN=localhost\nSTAGING_DOMAIN=staging.localhost\nSTAGING_USER=ci\nSTAGING_PASSWORD_HASH=%s\n' \
            "${hash//\$/\$\$}" | sudo tee /opt/kemdia/proxy/.env >/dev/null
          (cd /opt/kemdia/proxy && sudo docker compose up -d)

      - name: Déployer avec le vrai deploy.sh (migrations, puis bascule)
        env:
          WEB: ${{ steps.web.outputs.digest }}
          API: ${{ steps.api.outputs.digest }}
        run: |
          sudo /opt/kemdia/bin/deploy.sh production "$REPO/web@$WEB" "$REPO/api@$API" ci-v1 < /dev/null

      - name: Vérifier — santé, en-têtes, isolement des réseaux
        run: |
          health() { curl -fsSk --max-time 10 https://localhost/api/health; }
          for i in $(seq 1 20); do health | grep -q '"version":"ci-v1"' && break; sleep 3; done
          health | grep -q '"version":"ci-v1"' || { echo "::error::le site ne répond pas en ci-v1 derrière Caddy"; exit 1; }
          headers=$(curl -fsSk -o /dev/null -D - https://localhost/)
          for h in content-security-policy strict-transport-security x-frame-options x-content-type-options; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::en-tête manquant : $h"; exit 1; }
          done
          curl -fsSk https://localhost/ | grep -q "Kemdia" || { echo "::error::page d'accueil invalide"; exit 1; }
          # L'API répond et joint sa base
          docker exec kemdia-production-api wget -qO- http://127.0.0.1:4000/api/health | grep -q '"database":"ok"'
          # Aucun port de la base, de l'API ni du site sur la machine : seul Caddy écoute (80/443)
          if ss -ltnH | awk '{print $4}' | grep -Eq ':(5432|4000|3000)$'; then
            echo "::error::un port interne est ouvert sur la machine"; ss -ltn; exit 1
          fi
          # Le site ne voit pas la base ; la base n'a aucune sortie vers Internet
          docker exec kemdia-production-web node -e "require('dns').lookup('db',(e)=>process.exit(e?0:1))" \
            || { echo "::error::le site résout la base de données"; exit 1; }
          if docker exec kemdia-production-db wget -q -T 5 -O /dev/null http://example.com 2>/dev/null; then
            echo "::error::la base de données joint Internet"; exit 1
          fi
          echo "✅ ci-v1 derrière Caddy ; API et base saines ; réseaux isolés"

      - name: Nouvelle version, retour arrière, refus
        env:
          WEB: ${{ steps.web.outputs.digest }}
          API: ${{ steps.api.outputs.digest }}
        run: |
          version() { curl -fsSk --max-time 10 https://localhost/api/health | jq -r .version; }
          sudo /opt/kemdia/bin/deploy.sh production "$REPO/web@$WEB" "$REPO/api@$API" ci-v2 < /dev/null
          [ "$(version)" = ci-v2 ]
          sudo /opt/kemdia/bin/deploy.sh production rollback < /dev/null
          [ "$(version)" = ci-v1 ]
          # Images hors du dépôt déclaré, sans digest, ou version piégée : refusées avant tout téléchargement
          fake=sha256:$(printf 'a%.0s' $(seq 1 64))
          for args in "ghcr.io/autre/kemdia/web@$fake $REPO/api@$API ci-x" \
                      "$REPO/web:ci $REPO/api@$API ci-x" \
                      "$REPO/web@$WEB $REPO/api@$API ci;reboot"; do
            # shellcheck disable=SC2086
            if sudo /opt/kemdia/bin/deploy.sh production $args < /dev/null 2>/dev/null; then
              echo "::error::deploy.sh a accepté : $args"; exit 1
            fi
          done
          [ "$(version)" = ci-v1 ]
          echo "✅ nouvelle version, retour arrière et refus vérifiés"

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          sudo cat /opt/kemdia/deploy.log || true
          sudo docker compose --env-file /opt/kemdia/state/production.env -f /opt/kemdia/app/compose.yml logs --tail 80 || true
          (cd /opt/kemdia/proxy && sudo docker compose logs --tail 40) || true

  deploy-staging:
    name: Déploiement STAGING
    needs: [image, image-api]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
      api-image: ${{ needs.image-api.outputs.image }}@${{ needs.image-api.outputs.digest }}
      version: sha-${{ github.sha }}
      url: ${{ vars.STAGING_URL }}
    secrets: inherit

  # Démo publique gratuite (Render, offre Free) : mêmes images que staging, déployées par digest.
  # D'abord l'API (S3-T07), puis le site. Chaque partie est ignorée tant que son deploy hook n'est pas défini
  # (voir docs/guides/demo-gratuite.md).
  deploy-demo:
    name: Déploiement DÉMO (Render)
    needs: [image, image-api]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-demo
      cancel-in-progress: true
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      DEMO_URL: ${{ vars.DEMO_URL }}
      DEMO_API_URL: ${{ vars.DEMO_API_URL }}
      GHCR_IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
      GHCR_API_IMAGE: ${{ needs.image-api.outputs.image }}
      API_DIGEST: ${{ needs.image-api.outputs.digest }}
      # Recalculé ici : GitHub supprime les sorties de job qui contiennent un secret
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'kemdia' }}
      DOCKERHUB_API_REPO: ${{ vars.DOCKERHUB_API_REPO || 'kemdia-api' }}
      VERSION: sha-${{ github.sha }}
    steps:
      - name: Préparer
        run: |
          # Déclenche un deploy hook Render avec l'image à servir (URL secrète : jamais affichée)
          cat > "$RUNNER_TEMP/render.sh" <<'SCRIPT'
          trigger() {
            local hook="$1" image="$2" img sep='?'
            img=$(jq -rn --arg v "$image" '$v|@uri')
            case "$hook" in *\?*) sep='&';; esac
            curl -fsS -X POST -o /dev/null "${hook}${sep}imgURL=${img}"
            echo "Déploiement demandé : $image"
          }
          # Attend que /api/health renvoie la version du commit (démarrage à froid possible : ~1 min)
          wait_version() {
            local url="$1" body
            for i in $(seq 1 45); do
              body=$(curl -fsS --max-time 90 "$url/api/health" || true)
              if echo "$body" | grep -q "\"version\":\"$VERSION\""; then echo "✅ $url : $body"; return 0; fi
              echo "… tentative $i : ${body:-pas de réponse}"; sleep 20
            done
            echo "::error::$url ne sert pas encore $VERSION après ~15 min (voir le tableau de bord Render)."
            return 1
          }
          SCRIPT

      # 1. L'API d'abord : le nouveau site ne doit jamais parler à une ancienne API
      - name: Déployer l'API
        id: api
        run: |
          . "$RUNNER_TEMP/render.sh"
          if [ -z "$API_HOOK" ]; then
            echo "::notice::API de démo ignorée : le secret RENDER_API_DEPLOY_HOOK_URL n'est pas défini."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::La démo de l'API tire l'image publique de Docker Hub : DOCKERHUB_USERNAME est requis."; exit 1
          fi
          trigger "$API_HOOK" "docker.io/${DOCKERHUB_USERNAME,,}/${DOCKERHUB_API_REPO,,}@$API_DIGEST"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Attendre l'API (migrations + import de démonstration au démarrage)
        if: steps.api.outputs.ready == 'true' && env.DEMO_API_URL != ''
        run: |
          . "$RUNNER_TEMP/render.sh"
          wait_version "$DEMO_API_URL"
          # Retentées comme pour le site : Render peut répondre 502 juste après la bascule
          body=$(curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 30 "$DEMO_API_URL/api/health")
          echo "$body" | grep -q '"database":"ok"' || { echo "::error::API en ligne mais base indisponible : $body"; exit 1; }
          curl -fsS -o /dev/null --retry 5 --retry-delay 15 --retry-all-errors --max-time 30 "$DEMO_API_URL/api/v1/categories"

      # 2. Puis le site
      - name: Déployer le site
        id: web
        run: |
          . "$RUNNER_TEMP/render.sh"
          if [ -z "$HOOK" ]; then
            echo "::notice::Démo ignorée : le secret RENDER_DEPLOY_HOOK_URL n'est pas défini."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Image publique Docker Hub si configurée (Render la tire sans identifiants), sinon GHCR
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            IMAGE="docker.io/${DOCKERHUB_USERNAME,,}/${DOCKERHUB_REPO,,}@$DIGEST"
          else
            IMAGE="$GHCR_IMAGE@$DIGEST"
          fi
          trigger "$HOOK" "$IMAGE"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Attendre la nouvelle version du site
        if: steps.web.outputs.ready == 'true' && env.DEMO_URL != ''
        run: |
          . "$RUNNER_TEMP/render.sh"
          wait_version "$DEMO_URL"

      - name: Vérifier la page d'accueil, les en-têtes de sécurité et la source du catalogue
        if: steps.web.outputs.ready == 'true' && env.DEMO_URL != ''
        env:
          API_READY: ${{ steps.api.outputs.ready }}
        run: |
          # Juste après la bascule vers la nouvelle version, Render peut répondre 502 quelques secondes
          # (l'ancienne instance s'arrête) : chaque requête est retentée, 5 fois au plus, toutes les 15 s.
          get() { curl -fsS --retry 5 --retry-delay 15 --retry-all-errors "$@"; }
          headers=$(get -o /dev/null -D - --max-time 90 "$DEMO_URL/")
          for h in content-security-policy strict-transport-security x-frame-options; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::En-tête manquant : $h"; exit 1; }
          done
          get --max-time 90 "$DEMO_URL/" | grep -q "Kemdia"
          health=$(get --max-time 30 "$DEMO_URL/api/health")
          source=$(echo "$health" | jq -r '.catalog // "inconnu"')
          if [ "$API_READY" = "true" ] && [ "$source" != "api" ]; then
            echo "::error::Le site de démo ne lit pas l'API (catalogue : $source). Vérifier API_URL et API_INTERNAL_KEY sur Render."
            exit 1
          fi
          get --max-time 90 "$DEMO_URL/produit/apple-google-pixel-modern-blanc" | grep -q "Apple Google Pixel Modern Blanc"
          {
            echo "### Démo publique en ligne : $DEMO_URL (\`$VERSION\`)"
            echo "- Catalogue lu dans : **$source**"
            if [ -n "$DEMO_API_URL" ] && [ "$API_READY" = "true" ]; then echo "- API : $DEMO_API_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
