# Mises à jour automatiques (S2-T09). Chaque PR passe par toute la CI (tests, bout en bout, performance, sécurité).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Libreville }
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      prisma:
        patterns: ["prisma", "@prisma/*", "pg", "@types/pg"]
      nestjs:
        patterns: ["@nestjs/*", "nestjs-pino", "pino", "pino-http", "pino-pretty", "helmet"]
      tests:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@testing-library/*",
            "jsdom",
            "@playwright/test",
            "@axe-core/*",
            "supertest",
            "@types/supertest",
            "unplugin-swc",
          ]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types Node alignés sur la version d'exécution (Node 22 LTS) : majeure décidée à la main
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Majeures décidées à la main (ADR-0014) : TypeScript 7 attend la 7.1 et la compatibilité de typescript-eslint ;
      # ESLint 10 pour le site attend eslint-config-next (l'API et le contrat y sont déjà)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # Met aussi à jour les SHA épinglés des actions GitHub (une seule PR groupée)
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Libreville }
    labels: [dependencies]
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/apps/web", "/apps/api"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Libreville }
    labels: [dependencies]
    commit-message: { prefix: "chore(docker)" }
    ignore:
      # On reste sur Node.js LTS (22) : les versions majeures se décident manuellement
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Images épinglées par digest de la pile serveur (PostgreSQL, Caddy) — S7-T04, ADR-0043
  - package-ecosystem: docker-compose
    directories: ["/deploy/app", "/deploy/proxy"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Libreville }
    labels: [dependencies]
    commit-message: { prefix: "chore(docker)" }
    ignore:
      # Version majeure de PostgreSQL : décision manuelle (pg_upgrade des données)
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
