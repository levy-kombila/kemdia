packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# Scripts d'installation inutiles, ignorés volontairement :
# - @swc/core vérifie seulement le binaire natif, déjà fourni par un paquet optionnel ;
# - prisma / @prisma/engines téléchargent le moteur de migrations, que Prisma récupère de toute façon
#   à la première commande (pnpm generate, db:migrate…) : l'installation reste rapide et hors réseau.
# - @scarf/scarf (dépendance de swagger-ui-dist) envoie des statistiques d'installation à un service tiers : bloqué.
ignoredBuiltDependencies:
  - "@swc/core"
  - "@prisma/engines"
  - prisma
  - "@scarf/scarf"

# Correctifs de sécurité imposés à des sous-dépendances (pnpm audit) :
# - outil Prisma 7.10 (CLI uniquement, absent de l'exécution de l'API) : mysql2 3.15 et deepmerge-ts 7
#   ont des failles corrigées (GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3, GHSA-ggr8-5vv4-36mx).
#   À retirer quand Prisma livrera ces versions lui-même.
overrides:
  mysql2: ^3.24.5
  deepmerge-ts: ^8.0.2
  # GHSA-27r3-jxmh-p828 (2026-10-23) : body-parser < 2.4.0, déni de service ; express ne le relève pas encore
  body-parser: ^2.4.0
  # GHSA-q7qp-rjg7-q26m (S8-T04) : multer < 2.5.0, déni de service (envois de fichiers) ; @nestjs/platform-express 12.2
  # impose encore 2.4.0
  multer: ^2.5.0
  # GHSA-w74x-v6f9-j3xg et suivantes (S8-T04) : fast-uri < 3.1.9, outil Prisma (CLI) seulement
  fast-uri: ^3.1.9
