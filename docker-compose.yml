# Environnement local (voir docs/guides/base-de-donnees.md) :
#   docker compose up -d db          PostgreSQL seul, pour développer l'API (pnpm dev)
#   docker compose up --build        tout : base → migrations → API → site, avec les images de production (S3-T06)
# Le site lit toujours l'API (S3-T08) : API_INTERNAL_KEY=<clé> OBLIGATOIRE dans un fichier .env à la racine
# (jamais dans Git) ; sans elle, le site refuse de démarrer avec un message.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # L'image fixe APP_ENV=production par défaut, qui exige l'API : ici on est sur le poste.
      APP_ENV: local
      # Clé du .env de la racine, partagée avec l'API ci-dessous
      API_URL: http://api:4000
      # Sans clé, le site refuse de démarrer avec un message clair (pas de `:?` ici : `up -d db` doit marcher sans .env)
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Migrations de la base : tâche ponctuelle, avec la MÊME image que l'API, avant chaque démarrage de l'API
  api-migrate:
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: local
    image: kemdia-api:local
    command: ["node", "dist/database/migrate.js"]
    environment: &api-env
      APP_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-kemdia}:${POSTGRES_PASSWORD:-kemdia}@db:5432/${POSTGRES_DB:-kemdia}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # API NestJS (image de production) : démarre seulement si les migrations ont réussi
  api:
    build: *api-build
    image: kemdia-api:local
    environment:
      <<: *api-env
      API_INTERNAL_KEY: ${API_INTERNAL_KEY:-}
      API_DOCS: "true"
    ports:
      # Même port que `pnpm dev` : arrêter l'un avant de lancer l'autre
      - "127.0.0.1:4000:4000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # PostgreSQL 18 : même version majeure que la démo (Render) et la future production.
  # Identifiants de DÉVELOPPEMENT uniquement (base accessible seulement depuis ce poste) ;
  # on peut les changer dans un fichier .env à la racine (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB).
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kemdia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kemdia}
      POSTGRES_DB: ${POSTGRES_DB:-kemdia}
      # Mots de passe vérifiés par SCRAM-SHA-256 (jamais en clair sur le réseau)
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8
      TZ: Africa/Libreville
    ports:
      # 127.0.0.1 : la base n'est PAS joignable depuis le réseau local (Wi-Fi, etc.)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 range ses données sous /var/lib/postgresql/18/… : on monte le dossier parent
      - kemdia-db:/var/lib/postgresql
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  # Données conservées entre deux redémarrages ; `docker compose down -v` les efface
  kemdia-db:
