# Reverse proxy Caddy : HTTPS automatique (Let's Encrypt), compression, redirections.
# Démarré une seule fois sur le serveur : cd /opt/kemdia/proxy && docker compose up -d
name: kemdia-proxy

services:
  caddy:
    # Épinglée par digest (mise à jour par Dependabot, écosystème docker-compose)
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    container_name: kemdia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Un réseau d'entrée par environnement (S7-T04) : Caddy rejoint les deux, les sites ne se voient pas
    networks: [edge-production, edge-staging]

volumes:
  caddy_data:
  caddy_config:

networks:
  edge-production:
    external: true
    name: kemdia-edge-production
  edge-staging:
    external: true
    name: kemdia-edge-staging
