# Reverse proxy Caddy : HTTPS automatique (Let's Encrypt), compression, redirections.
# Démarré une seule fois sur le serveur : cd /opt/kemdia/proxy && docker compose up -d
name: kemdia-proxy

services:
  caddy:
    # Épinglée par digest (mise à jour par Dependabot, écosystème docker-compose)
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: kemdia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    # Un réseau d'entrée par environnement (S7-T04) : Caddy rejoint les deux, les sites ne se voient pas
    networks: [edge-production, edge-staging]

volumes:
  caddy_data:
  caddy_config:

networks:
  edge-production:
    external: true
    name: kemdia-edge-production
  edge-staging:
    external: true
    name: kemdia-edge-staging
