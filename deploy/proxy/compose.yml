# Reverse proxy Caddy : HTTPS automatique (Let's Encrypt), compression, redirections.
# Démarré une seule fois sur le serveur : cd /opt/kemdia/proxy && docker compose up -d
name: kemdia-proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: kemdia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks: [edge]

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
